# augmentation_config.yaml
augmentations:
  mirror:
    name: "Mirror"
    slider_attr: "mirror_slider"
    value_attr: "mirror_value"
    default_value: 50
    details: "Mirrors the image horizontally (left to right). This creates a flipped version of the original image. The percentage controls how often mirroring is applied."
  
  rotate:
    name: "Rotate"
    slider_attr: "rotate_slider" 
    value_attr: "rotate_value"
    default_value: 50
    details: "Rotates the image. Higher percentage means rotation will be applied more frequently."
  
  crop:
    name: "Crop"
    slider_attr: "crop_slider"
    value_attr: "crop_value" 
    default_value: 50
    details: "Crops a portion of the image. Higher percentage means cropping will be applied more frequently."
  
  zoom:
    name: "Zoom"
    slider_attr: "zoom_slider"
    value_attr: "zoom_value"
    default_value: 50
    details: "Zooms in or out of the image. Higher percentage means zoom operations will be applied more frequently."
  
  overlay:
    name: "Overlay"
    slider_attr: "overlay_slider"
    value_attr: "overlay_value"
    default_value: 50
    details: "Overlays objects from one image onto another. Higher percentage means overlays will be applied more frequently. Requires overlay directory selection."
  
  # Albumentations-based augmentations - direct mapping to library functions
  gaussianblur:
    name: "Gaussian Blur"
    slider_attr: "gaussianblur_slider"
    value_attr: "gaussianblur_value"
    default_value: 30
    details: "Applies a Gaussian blur to the image. Higher percentage means blur will be applied more frequently."
  
  motionblur:
    name: "Motion Blur"
    slider_attr: "motionblur_slider"
    value_attr: "motionblur_value"
    default_value: 20
    details: "Applies a directional motion blur to the image. Higher percentage means motion blur will be applied more frequently."
  
  randombrightnessconstrant:
    name: "Brightness/Contrast"
    slider_attr: "randombrightnessconstrant_slider"
    value_attr: "randombrightnessconstrant_value"
    default_value: 40
    details: "Randomly changes brightness and contrast of the image. Higher percentage means this effect will be applied more frequently."
  
  randomfog:
    name: "Fog Effect"
    slider_attr: "randomfog_slider"
    value_attr: "randomfog_value"
    default_value: 20
    details: "Adds a fog effect to the image. Higher percentage means fog will be applied more frequently."

  randomshadow:
    name: "Random Shadow"
    slider_attr: "randomshadow_slider"
    value_attr: "randomshadow_value"
    default_value: 25
    details: "Adds random shadows to the image. Higher percentage means shadows will be applied more frequently."

# Skip categories (these appear as columns in the skip table)
skip_categories:
  - "Zoom"
  - "Crop"
  - "Rotate"
  - "Mirror"
  - "Overlay"
  - "Gaussian Blur"
  - "Motion Blur"
  - "Brightness/Contrast"
  - "Fog Effect"
  - "Random Shadow"

# Float parameters for sliders
float_params:
  zoom_slider:
    - attr: "zoom_in_min_padding"
      name: "Zoom In Min Padding:"
      default: 0.05
      min: 0.0
      max: 1.0
      step: 0.01
    - attr: "zoom_in_max_padding"
      name: "Zoom In Max Padding:"
      default: 0.5
      min: 0.0
      max: 1.0
      step: 0.01
    - attr: "zoom_out_min_padding"
      name: "Zoom Out Min Padding:"
      default: 0.1
      min: 0.0
      max: 1.0
      step: 0.01
    - attr: "zoom_out_max_padding"
      name: "Zoom Out Max Padding:"
      default: 0.8
      min: 0.0
      max: 1.0
      step: 0.01
  
  overlay_slider:
    - attr: "overlay_min_scale"
      name: "Overlay Min Scale:"
      default: 0.3
      min: 0.0
      max: 1.0
      step: 0.01
    - attr: "overlay_max_scale"
      name: "Overlay Max Scale:"
      default: 1.0
      min: 0.0
      max: 2.0
      step: 0.01
  
  # Float parameters for albumentations augmentations
  gaussianblur_slider:
    - attr: "gaussianblur_sigma_limit"
      name: "Blur Sigma Limit:"
      default: 3.0
      min: 0.0
      max: 10.0
      step: 0.1
  
  motionblur_slider:
    - attr: "motionblur_blur_limit"
      name: "Motion Blur Limit:"
      default: 7
      min: 3
      max: 20
      step: 1
  
  randombrightnessconstrant_slider:
    - attr: "randombrightnessconstrant_brightness_limit"
      name: "Brightness Limit:"
      default: 0.2
      min: 0.0
      max: 1.0
      step: 0.05
    - attr: "randombrightnessconstrant_contrast_limit"
      name: "Contrast Limit:"
      default: 0.2
      min: 0.0
      max: 1.0
      step: 0.05
  
  randomfog_slider:
    - attr: "randomfog_fog_coef_lower"
      name: "Fog Coefficient Lower:"
      default: 0.3
      min: 0.1
      max: 0.5
      step: 0.05
    - attr: "randomfog_fog_coef_upper"
      name: "Fog Coefficient Upper:"
      default: 0.5
      min: 0.3
      max: 1.0
      step: 0.05
  
  randomshadow_slider:
    - attr: "randomshadow_shadow_dimension"
      name: "Shadow Dimension:"
      default: 5
      min: 3
      max: 10
      step: 1

# Child sliders for parent sliders
child_sliders:
  rotate_slider:
    - attr: "rotation_random_vs_90_slider"
      name: "Rotation (0 to 360) vs 90°: "
      default: 25
  
  crop_slider:
    - attr: "maintain_aspect_ratio_slider"
      name: "Maintain Aspect Ratio on Crop: "
      default: 50
  
  zoom_slider:
    - attr: "zoom_in_vs_out_slider"
      name: "Zoom In vs Out: "
      default: 40